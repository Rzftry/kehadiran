<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Attendance Checklist (2 Per Page)</title>
    <style>
        /* --- SETTING UNTUK PAPARAN SKRIN (BROWSER) --- */
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        
        .controls { margin-bottom: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 5px; text-align: center; position: sticky; top: 0; z-index: 100;}
        .controls label { font-weight: bold; }
        .controls select, .controls input { padding: 5px; margin-right: 15px; font-size: 14px;}
        .controls button { padding: 6px 15px; font-weight: bold; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 3px;}
        
        /* Kotak pembalut untuk paparan skrin */
        .page-container { max-width: 210mm; margin: 0 auto; background: white; padding: 10mm; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        
        .form-wrapper { margin-bottom: 10mm; }
        .cut-line { text-align: center; border-bottom: 2px dashed #999; margin: 5mm 0; font-size: 10px; color: #666; position: relative; }
        .cut-line span { position: relative; top: 8px; background: white; padding: 0 10px; }

        /* --- REKA BENTUK FORM --- */
        .header { text-align: center; margin-bottom: 8px; }
        .header h2 { margin: 0; font-size: 14px; }
        .header h3 { margin: 2px 0 0 0; font-size: 10px; font-weight: normal; }
        
        .info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 10px; font-weight: bold;}
        .info div { width: 48%; }
        .info span { border-bottom: 1px solid black; display: inline-block; width: 70%; }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            border: 2px solid black; 
            width: 100%; 
            background-color: white;
        }
        
        .day-header {
            background-color: #333;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 9px;
            padding: 4px 0;
            border: 1px solid black;
        }

        .day-cell { 
            display: flex; 
            flex-direction: column; 
            border: 1px solid black; 
            min-height: 50px; 
            position: relative;
        }
        .day-number { 
            background-color: #d9d9d9; 
            text-align: left; 
            font-weight: bold; 
            font-size: 9px; 
            padding: 2px 4px; 
            border-bottom: 1px solid black; 
        }
        .stamp-space { flex-grow: 1; } 
        .empty-cell { background-color: #f9f9f9; border: 1px solid black; }

        /* Highlight Kolum */
        .col-monday { background-color: #fff9e6; }
        .col-saturday { background-color: #e6f2ff; }
        .col-sunday { background-color: #ffe6e6; }

        /* --- SETTING UNTUK PRINT (A4) - DIPERBETULKAN --- */
        @media print {
            /* Set margin kertas A4 kepada 5mm supaya ruang luas */
            @page { size: A4 portrait; margin: 5mm; }
            
            /* Paksa warna keluar masa print */
            html, body { 
                width: 200mm; /* 210mm - 10mm margin */
                margin: 0; 
                padding: 0; 
                background: white; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            
            .controls { display: none; }
            .page-container { padding: 0; margin: 0; box-shadow: none; width: 100%; }
            
            /* Kunci setiap form pada ketinggian ~135mm (Separuh A4) */
            .form-wrapper { 
                height: 135mm; 
                display: flex;
                flex-direction: column;
                page-break-inside: avoid;
            }
            
            /* Kecilkan sikit elemen masa print */
            .header h2 { font-size: 13px; }
            .header h3 { font-size: 9px; }
            .info { font-size: 9px; margin-bottom: 5px; }
            
            /* Kunci saiz grid dan kotak */
            .grid-container { flex-grow: 1; }
            .day-header { height: 15px; padding: 0; line-height: 15px; font-size: 8px; }
            .day-cell { min-height: 0; height: 18mm; } /* 18mm x 6 baris = 108mm */
            .day-number { font-size: 8px; padding: 1px 3px; }
            
            .cut-line { margin: 2mm 0; border-bottom: 1px dashed #000; }
            .cut-line span { display: none; } /* Sembunyi emoji gunting masa print, biar garisan je */
        }
    </style>
</head>
<body>

    <!-- Kawalan -->
    <div class="controls">
        <label>Pilih Bulan: </label>
        <select id="monthSelect"></select>
        <label> Tahun: </label>
        <input type="number" id="yearInput" value="2025" style="width: 80px;">
        <button onclick="window.print()">🖨️ Print (2 Form 1 Page)</button>
    </div>

    <div class="page-container">
        
        <!-- FORM STAFF 1 -->
        <div class="form-wrapper">
            <div class="header">
                <h2>PARKSON IOI CITY MALL</h2>
                <h3>MONTHLY BRIEFING ATTENDANCE AND GROOMING CHECKLIST</h3>
            </div>
            <div class="info">
                <div>NAME: <span></span><br><br>Month/YEAR: <span class="displayMonthYear"></span></div>
                <div>DEPT: <span></span><br><br>BRAND: <span></span></div>
            </div>
            <div class="grid-container" id="grid1"></div>
        </div>

        <!-- GARISAN GUNTING -->
        <div class="cut-line"><span>✂️ GUNTING DI SINI ✂️</span></div>

        <!-- FORM STAFF 2 -->
        <div class="form-wrapper">
            <div class="header">
                <h2>PARKSON IOI CITY MALL</h2>
                <h3>MONTHLY BRIEFING ATTENDANCE AND GROOMING CHECKLIST</h3>
            </div>
            <div class="info">
                <div>NAME: <span></span><br><br>Month/YEAR: <span class="displayMonthYear"></span></div>
                <div>DEPT: <span></span><br><br>BRAND: <span></span></div>
            </div>
            <div class="grid-container" id="grid2"></div>
        </div>

    </div>

    <script>
        const monthSelect = document.getElementById('monthSelect');
        const yearInput = document.getElementById('yearInput');
        const displayMonthYears = document.querySelectorAll('.displayMonthYear');
        const grids = [document.getElementById('grid1'), document.getElementById('grid2')];
        
        const months = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];
        const daysName = ["ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU", "AHAD"];

        months.forEach((m, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerHTML = m;
            monthSelect.appendChild(opt);
        });

        function generateCalendar() {
            const month = parseInt(monthSelect.value);
            const year = parseInt(yearInput.value);
            
            displayMonthYears.forEach(el => {
                el.innerText = months[month] + " " + year;
            });

            const firstDay = new Date(year, month, 1).getDay(); 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startOffset = (firstDay + 6) % 7; 

            grids.forEach(grid => {
                grid.innerHTML = ""; 

                daysName.forEach(day => {
                    let header = document.createElement('div');
                    header.className = 'day-header';
                    header.innerText = day;
                    grid.appendChild(header);
                });

                for (let i = 0; i < startOffset; i++) {
                    let empty = document.createElement('div');
                    empty.className = 'empty-cell';
                    grid.appendChild(empty);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    let cell = document.createElement('div');
                    cell.className = 'day-cell';

                    let currentDayOfWeek = (startOffset + day - 1) % 7;
                    if (currentDayOfWeek === 0) cell.classList.add('col-monday');
                    if (currentDayOfWeek === 5) cell.classList.add('col-saturday');
                    if (currentDayOfWeek === 6) cell.classList.add('col-sunday');

                    cell.innerHTML = `
                        <div class="day-number">
                            <span>${day}</span>
                        </div>
                        <div class="stamp-space"></div>
                    `;
                    grid.appendChild(cell);
                }
                
                let totalCells = startOffset + daysInMonth;
                let remainingCells = (7 - (totalCells % 7)) % 7;
                for (let i = 0; i < remainingCells; i++) {
                    let empty = document.createElement('div');
                    empty.className = 'empty-cell';
                    grid.appendChild(empty);
                }
            });
        }

        monthSelect.addEventListener('change', generateCalendar);
        yearInput.addEventListener('input', generateCalendar);
        generateCalendar();
    </script>
</body>
</html>
